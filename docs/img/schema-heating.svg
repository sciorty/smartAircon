<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="sans-serif">
  <!-- Schema del climatizzatore IN CALDO (17/11/2026): uguale a clima_schema.svg (freddo) ma col giro del gas invertito
       dalla valvola a 4 vie: il gas caldo va alla batteria interna, la batteria esterna diventa la parte fredda.
       Home Assistant mostra questo quando la macchina dice «caldo» (state_image del picture-elements).
       Colori a metà tono: si leggono sia col tema chiaro sia con quello scuro. Le etichette con i valori sono
       sovrapposte da Home Assistant (picture-elements), alle posizioni indicate nei commenti (in % di larghezza/altezza). -->
  <defs>
    <marker id="fr" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c8278"/>
    </marker>
    <marker id="fr-r" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bd7050"/>
    </marker>
    <marker id="fr-g" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#d6a65a"/>
    </marker>
    <marker id="fr-b" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f8db0"/>
    </marker>
  </defs>

  <!-- unità -->
  <rect x="20" y="70" width="420" height="320" rx="22" fill="#8c8278" fill-opacity="0.08" stroke="#8c8278" stroke-width="3"/>
  <rect x="560" y="70" width="420" height="320" rx="22" fill="#8c8278" fill-opacity="0.08" stroke="#8c8278" stroke-width="3"/>
  <text x="40" y="58" font-size="26" font-weight="700" fill="#8c8278">INDOOR UNIT</text>
  <text x="960" y="58" font-size="26" font-weight="700" fill="#8c8278" text-anchor="end">OUTDOOR UNIT</text>

  <!-- circuito del gas in caldo -->
  <!-- mandata compressore → batteria interna (calda) -->
  <path d="M632,280 L620,280 L620,100 L265,100 L265,132" fill="none" stroke="#bd7050" stroke-width="7" stroke-linejoin="round" marker-end="url(#fr-r)"/>
  <!-- batteria interna → linea del liquido → batteria esterna -->
  <path d="M265,328 L265,420 L810,420 L810,326" fill="none" stroke="#d6a65a" stroke-width="7" stroke-linejoin="round" marker-end="url(#fr-g)"/>
  <!-- batteria esterna (fredda) → aspirazione → compressore -->
  <path d="M810,142 L810,130 L680,130 L680,224" fill="none" stroke="#5f8db0" stroke-width="7" stroke-linejoin="round" marker-end="url(#fr-b)"/>
  <text x="537" y="440" font-size="20" fill="#d6a65a" text-anchor="middle">liquid</text>
  <text x="500" y="90" font-size="20" fill="#bd7050" text-anchor="middle">discharge</text>
  <text x="745" y="120" font-size="20" fill="#5f8db0" text-anchor="middle">suction</text>

  <!-- aria della stanza: ripresa → batteria → ventola → mandata nei canali -->
  <path d="M30,230 L215,230" stroke="#8c8278" stroke-width="5" marker-end="url(#fr)"/>
  <text x="40" y="270" font-size="20" fill="#8c8278">return air</text>
  <path d="M395,230 L395,150" stroke="#8c8278" stroke-width="5" marker-end="url(#fr)" stroke-dasharray="2 0"/>
  <text x="425" y="150" font-size="20" fill="#8c8278" text-anchor="end">to the ducts</text>

  <!-- batteria interna (serpentina) -->
  <path d="M265,140 l-30,15 l60,15 l-60,15 l60,15 l-60,15 l60,15 l-60,15 l60,15 l-60,15 l60,15 l-60,15 l30,15"
        fill="none" stroke="#8c8278" stroke-width="5" stroke-linejoin="round"/>
  <text x="225" y="335" font-size="20" fill="#8c8278" text-anchor="end">coil</text>

  <!-- ventola interna -->
  <circle cx="345" cy="230" r="36" fill="none" stroke="#8c8278" stroke-width="5"/>
  <path d="M345,230 q-6,-28 14,-30 M345,230 q28,-6 30,14 M345,230 q6,28 -14,30 M345,230 q-28,6 -30,-14"
        fill="none" stroke="#8c8278" stroke-width="5" stroke-linecap="round"/>
  <text x="345" y="300" font-size="20" fill="#8c8278" text-anchor="middle">fan</text>

  <!-- compressore -->
  <circle cx="680" cy="280" r="48" fill="#8c8278" fill-opacity="0.12" stroke="#8c8278" stroke-width="5"/>
  <text x="680" y="358" font-size="20" fill="#8c8278" text-anchor="middle">compressor</text>

  <!-- batteria esterna (serpentina) -->
  <path d="M810,150 l-30,14 l60,14 l-60,14 l60,14 l-60,14 l60,14 l-60,14 l60,14 l-60,14 l60,14 l-60,14 l30,14"
        fill="none" stroke="#8c8278" stroke-width="5" stroke-linejoin="round"/>
  <text x="850" y="340" font-size="20" fill="#8c8278" text-anchor="start">coil</text>

  <text x="915" y="112" font-size="20" fill="#8c8278" text-anchor="middle">outdoor air</text>
  <!-- ventola esterna -->
  <circle cx="915" cy="235" r="36" fill="none" stroke="#8c8278" stroke-width="5"/>
  <path d="M915,235 q-6,-28 14,-30 M915,235 q28,-6 30,14 M915,235 q6,28 -14,30 M915,235 q-28,6 -30,-14"
        fill="none" stroke="#8c8278" stroke-width="5" stroke-linecap="round"/>
  <text x="915" y="300" font-size="20" fill="#8c8278" text-anchor="middle">fan</text>
  <text x="500" y="478" font-size="18" fill="#8c8278" text-anchor="middle">heating: the cycle is reversed, hot gas heats the indoor coil and the outdoor coil gets cold</text>
</svg>
